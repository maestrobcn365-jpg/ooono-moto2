<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OOONO Moto CAT Pro</title>

<link rel="manifest" href="./manifest.json">

<style>
  :root {
    --ring-color: #1e293b;
    --ring-glow: transparent;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    gap: 6px;
  }

  .top-bar {
    width: 100%;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0d1117;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid #1f2937;
    font-size: 12px;
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ef4444;
  }
  .dot.active { background: #10b981; box-shadow: 0 0 8px #10b981; }
  .dot.warn { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

  #installBtn {
    background: linear-gradient(135deg, #059669, #10b981);
    color: #ffffff;
    border: none;
    padding: 6px 10px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 11px;
    cursor: pointer;
    display: none;
    align-items: center;
    gap: 4px;
  }

  #dbCounter {
    color: #10b981;
    font-weight: 800;
    background: #161f2c;
    padding: 5px 9px;
    border-radius: 8px;
    border: 1px solid #10b981;
    cursor: pointer;
    font-size: 11px;
  }

  .ooono-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 0;
  }
  .ooono-container {
    position: relative;
    width: min(58vw, 33dvh, 235px);
    height: min(58vw, 33dvh, 235px);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .led-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 14px solid var(--ring-color);
    box-shadow: 0 0 30px var(--ring-glow), inset 0 0 20px var(--ring-glow);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .led-ring.flash-red { animation: pulseRed 0.4s infinite alternate; }
  .led-ring.flash-orange { animation: pulseOrange 0.75s infinite alternate; }
  .led-ring.flash-purple { animation: pulsePurple 0.35s infinite alternate; }
  .led-ring.flash-blue { animation: pulseBlue 0.6s infinite alternate; }

  @keyframes pulseRed {
    from { border-color: #ff0033; box-shadow: 0 0 55px #ff0033, inset 0 0 25px #ff0033; }
    to { border-color: #33000a; box-shadow: 0 0 8px #ff0033; }
  }
  @keyframes pulseOrange {
    from { border-color: #ff8800; box-shadow: 0 0 40px #ff8800, inset 0 0 18px #ff8800; }
    to { border-color: #331a00; box-shadow: 0 0 5px #ff8800; }
  }
  @keyframes pulsePurple {
    from { border-color: #a855f7; box-shadow: 0 0 60px #a855f7, inset 0 0 30px #3b82f6; }
    to { border-color: #1e1b4b; box-shadow: 0 0 12px #3b82f6; }
  }
  @keyframes pulseBlue {
    from { border-color: #00d2ff; box-shadow: 0 0 45px #00d2ff, inset 0 0 20px #00d2ff; }
    to { border-color: #002b36; box-shadow: 0 0 8px #00d2ff; }
  }

  .center-button {
    width: calc(100% - 42px);
    height: calc(100% - 42px);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #1f2937, #090d16);
    border: 3px solid #374151;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 8px 20px rgba(0,0,0,0.85);
    text-align: center;
    padding: 8px;
  }
  .center-button:active { transform: scale(0.95); }
  .speed-value {
    font-size: clamp(40px, 7dvh, 56px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
  }
  .speed-unit {
    font-size: 11px;
    color: #9ca3af;
    text-transform: uppercase;
    margin-top: 3px;
    letter-spacing: 1px;
  }
  .limit-badge {
    margin-top: 5px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #ffffff;
    color: #000000;
    border: 5px solid #ef4444;
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 17px;
    font-weight: 900;
  }

  .alert-box {
    width: 100%;
    flex-shrink: 0;
    background: #0d1117;
    border: 1px solid #1f2937;
    border-radius: 14px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .alert-title {
    font-size: 16px;
    font-weight: 800;
    color: #10b981;
  }
  .alert-sub {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 95%;
  }

  .actions-grid {
    width: 100%;
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .btn {
    background: #161f2c;
    border: 1px solid #2d3748;
    color: #ffffff;
    padding: 10px 6px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
  }
  .btn:active { background: #2d3748; transform: scale(0.98); }
  .btn-danger { border-color: #ef4444; color: #fca5a5; }
  .btn-heli { border-color: #a855f7; color: #d8b4fe; }
  .btn-stop {
    grid-column: span 2;
    background: #2b1115;
    border-color: #dc2626;
    color: #fecaca;
    padding: 11px;
    font-size: 14px;
    display: none;
  }
</style>

<body>

  <div class="top-bar">
    <div class="status-pill">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">Toca el centro para iniciar</span>
    </div>
    <button id="installBtn" onclick="triggerInstall()">📲 INSTALAR</button>
    <div id="dbCounter" onclick="forceReloadRadars()" title="Toca para recargar">📍 75 | 🚁 0</div>
  </div>

  <div class="ooono-wrapper">
    <div class="ooono-container">
      <div id="ledRing" class="led-ring"></div>
      <div id="mainBtn" class="center-button"
           onmousedown="startPressTimer()" onmouseup="endPressTimer()"
           ontouchstart="startPressTimer()" ontouchend="endPressTimer()">
        <div id="speedDisplay" class="speed-value">OFF</div>
        <div id="speedUnit" class="speed-unit">ACTIVAR MOTO</div>
        <div id="limitBadge" class="limit-badge">80</div>
      </div>
    </div>
  </div>

  <div class="alert-box">
    <div id="alertTitle" class="alert-title">OOONO Moto CAT v6</div>
    <div id="alertSub" class="alert-sub">Toca para activar (Mantén pulsado para apagar)</div>
  </div>

  <div class="actions-grid">
    <button class="btn btn-danger" onclick="reportIncident('MÓVIL', 'Radar Móvil')">
      🚨 Reportar Móvil
    </button>
    <button class="btn btn-heli" onclick="reportIncident('HELI', 'Helicóptero Trànsit')">
      🚁 Reportar Heli
    </button>
    <button class="btn" onclick="testIntercomAudio()">
      🔊 Probar Casco
    </button>
    <button class="btn" onclick="togglePocketMode()">
      🌑 Modo Bolsillo
    </button>
    <button id="stopBtn" class="btn btn-stop" onclick="stopSystem()">
      ⏹️ APAGAR RADAR Y GPS
    </button>
  </div>

<script>
let swRegistration = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      swRegistration = await navigator.serviceWorker.register('./sw.js');
      swRegistration.update();
    } catch (e) {}
  });
}

// Solicitar permisos nativos de notificación al cargar
window.addEventListener('load', () => {
  if ('Notification' in window && Notification.permission !== 'granted') {
    Notification.requestPermission();
  }
});

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'flex';
});

async function triggerInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      document.getElementById('installBtn').style.display = 'none';
    }
    deferredPrompt = null;
  }
}

let pressTimer = null;
let longPressTriggered = false;

function startPressTimer() {
  longPressTriggered = false;
  pressTimer = setTimeout(() => {
    if (systemRunning) {
      longPressTriggered = true;
      stopSystem();
    }
  }, 1400);
}

function endPressTimer() {
  if (pressTimer) {
    clearTimeout(pressTimer);
    pressTimer = null;
  }
  if (!longPressTriggered) {
    handleMainButton();
  }
}

function startBackgroundAudioLock() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  if (!keepAliveAudio) {
    keepAliveAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
    keepAliveAudio.loop = true;
    keepAliveAudio.volume = 0.01;
  }
  keepAliveAudio.play().catch(() => {});
}

function showPushNotification(title, body) {
  if (swRegistration && swRegistration.active) {
    swRegistration.active.postMessage({ type: 'SHOW_NOTIFICATION', title, body });
  } else if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/192/2555/2555013.png' });
  }
}

function playOoonoBeep(pattern = 'RADAR') {
  if (!audioCtx) startBackgroundAudioLock();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const now = audioCtx.currentTime;
  const tone = (freq, start, duration, wave = 'sawtooth') => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, now + start);
    gain.gain.setValueAtTime(1.0, now + start);
    gain.gain.exponentialRampToValueAtTime(0.01, now + start + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + start);
    osc.stop(now + start + duration);
  };

  if (pattern === 'RADAR') {
    tone(2500, 0, 0.15); tone(2500, 0.20, 0.15); tone(2900, 0.42, 0.28);
  } else if (pattern === 'OVERSPEED') {
    tone(3200, 0, 0.14, 'square'); tone(2200, 0.16, 0.14, 'square');
    tone(3200, 0.32, 0.14, 'square'); tone(2200, 0.48, 0.20, 'square');
  } else if (pattern === 'HELI') {
    tone(1200, 0, 0.16); tone(1800, 0.18, 0.16); tone(2700, 0.36, 0.30);
  } else if (pattern === 'OFF') {
    tone(1800, 0, 0.18, 'sine'); tone(900, 0.20, 0.28, 'sine');
  }
}

function speakAlert(text, beepPattern = 'RADAR', pushTitle = '⚠️ Alerta de Radar') {
  playOoonoBeep(beepPattern);
  showPushNotification(pushTitle, text);
  setTimeout(() => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'es-ES';
      msg.rate = 1.05;
      msg.pitch = 1.0;
      msg.volume = 1.0;
      window.speechSynthesis.speak(msg);
    }
  }, 700);
}

async function handleMainButton() {
  if (!systemRunning) {
    await startSystem();
  } else {
    reportIncident('MÓVIL', 'Radar Móvil');
  }
}

async function startSystem() {
  startBackgroundAudioLock();
  systemRunning = true;

  document.getElementById('statusDot').className = 'dot active';
  document.getElementById('statusText').innerText = 'Protección Activa (2º Plano)';
  document.getElementById('speedDisplay').innerText = '0';
  document.getElementById('speedUnit').innerText = 'KM/H';
  document.getElementById('stopBtn').style.display = 'flex';

  showPushNotification('🛡️ OOONO Moto Protegido', 'Sistema activo en segundo plano vigilando la ruta.');

  if ('wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  speakAlert('OOONO Moto activado.', 'RADAR', '🛡️ OOONO Activo');

  fetchLiveRadars(userLat, userLon);
  fetchHelicopters();

  if ('geolocation' in navigator) {
    if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = navigator.geolocation.watchPosition(onGpsUpdate, onGpsError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 8000
    });
  }

  if (heliIntervalId) clearInterval(heliIntervalId);
  heliIntervalId = setInterval(fetchHelicopters, 15000);
}

async function stopSystem() {
  systemRunning = false;
  currentSpeed = 0;

  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
  if (heliIntervalId !== null) {
    clearInterval(heliIntervalId);
    heliIntervalId = null;
  }
  if (keepAliveAudio) {
    keepAliveAudio.pause();
  }
  if (wakeLock !== null) {
    try { await wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }

  playOoonoBeep('OFF');
  showPushNotification('⏹️ OOONO Moto Desconectado', 'Protección detenida.');

  pocketMode = false;
  document.body.style.opacity = '1';

  document.getElementById('statusDot').className = 'dot';
  document.getElementById('statusText').innerText = 'Sistema Desconectado';
  document.getElementById('speedDisplay').innerText = 'OFF';
  document.getElementById('speedUnit').innerText = 'ACTIVAR MOTO';
  document.getElementById('ledRing').className = 'led-ring';
  document.getElementById('limitBadge').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('alertTitle').innerText = 'Sistema Apagado';
  document.getElementById('alertSub').innerText = 'GPS y Audio Bluetooth desconectados.';
}

function forceReloadRadars() {
  document.getElementById('statusText').innerText = 'Actualizando bases...';
  fetchLiveRadars(userLat, userLon);
  fetchHelicopters();
}

function onGpsUpdate(pos) {
  if (!systemRunning) return;
  const newLat = pos.coords.latitude;
  const newLon = pos.coords.longitude;
  currentSpeed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
  document.getElementById('speedDisplay').innerText = currentSpeed;

  if (pos.coords.heading !== null && !isNaN(pos.coords.heading) && currentSpeed > 5) {
    userHeading = pos.coords.heading;
  } else if (prevLat !== null && calcDistance(prevLat, prevLon, newLat, newLon) > 5) {
    userHeading = calcBearing(prevLat, prevLon, newLat, newLon);
  }

  prevLat = userLat; prevLon = userLon;
  userLat = newLat; userLon = newLon;

  const distFromLastFetch = calcDistance(userLat, userLon, lastFetchCoords.lat, lastFetchCoords.lon);
  if (distFromLastFetch > 3500 || lastFetchCoords.lat === 0) {
    lastFetchCoords = { lat: userLat, lon: userLon };
    fetchLiveRadars(userLat, userLon);
    fetchHelicopters();
  }

  checkProximityAlerts();
}

function onGpsError(err) {
  if (!systemRunning) return;
  document.getElementById('statusDot').className = 'dot warn';
  document.getElementById('alertSub').innerText = 'Buscando señal GPS exterior...';
}

async function fetchBlitzerPois(minLat, minLon, maxLat, maxLon) {
  const target = `https://cdn2.atudo.net/api/4.0/pois.php?type=0,1,2,3,4,5,6,101,102,103,104,105,106,107&box=${minLat},${minLon},${maxLat},${maxLon}`;
  const proxies = [
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(target)}`
  ];
  for (const p of proxies) {
    try {
      const res = await fetch(p);
      if (res.ok) {
        const data = await res.json();
        if (data && data.pois) return data.pois;
      }
    } catch (e) {}
  }
  return [];
}

async function fetchOsmRadars(minLat, minLon, maxLat, maxLon) {
  const query = `[out:json][timeout:20];(
    node["highway"="speed_camera"](${minLat},${minLon},${maxLat},${maxLon});
    node["enforcement"](${minLat},${minLon},${maxLat},${maxLon});
    relation["enforcement"="maxspeed"](${minLat},${minLon},${maxLat},${maxLon});
    relation["enforcement"="average_speed"](${minLat},${minLon},${maxLat},${maxLon});
  );out center;`;

  const mirrors = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
  ];
  for (const url of mirrors) {
    try {
      const res = await fetch(url, {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query),
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      });
      if (res.ok) {
        const data = await res.json();
        if (data && data.elements && data.elements.length > 0) {
          return data.elements.map(el => ({
            id: el.id,
            lat: el.lat || (el.center && el.center.lat),
            lon: el.lon || (el.center && el.center.lon),
            tags: el.tags || {}
          }));
        }
      }
    } catch (e) {}
  }
  return [];
}

async function fetchLiveRadars(lat, lon) {
  const delta = 0.45;
  const minLat = (lat - delta).toFixed(4);
  const maxLat = (lat + delta).toFixed(4);
  const minLon = (lon - delta).toFixed(4);
  const maxLon = (lon + delta).toFixed(4);

  let combined = [...CATALUNYA_STATIC_RADARS, ...customReports];

  const [blitzerList, osmList] = await Promise.all([
    fetchBlitzerPois(minLat, minLon, maxLat, maxLon),
    fetchOsmRadars(minLat, minLon, maxLat, maxLon)
  ]);

  blitzerList.forEach(p => {
    const isMobile = parseInt(p.type) < 50;
    combined.push({
      id: 'blz-' + p.id,
      lat: parseFloat(p.lat),
      lon: parseFloat(p.lng),
      vmax: parseInt(p.vmax) || 0,
      type: isMobile ? 'MÓVIL' : 'FIJO',
      name: isMobile ? 'Radar Móvil (Blitzer.de)' : 'Radar Fijo Blitzer'
    });
  });

  osmList.forEach(el => {
    if (!el.lat || !el.lon) return;
    const isTrafficLight = el.tags && el.tags.enforcement === 'traffic_signals';
    const isAvgSpeed = el.tags && el.tags.enforcement === 'average_speed';
    combined.push({
      id: 'osm-' + el.id,
      lat: el.lat,
      lon: el.lon,
      vmax: (el.tags && el.tags.maxspeed) ? parseInt(el.tags.maxspeed) : 0,
      type: isTrafficLight ? 'SEMÁFORO' : (isAvgSpeed ? 'TRAMO' : 'FIJO'),
      name: (el.tags && el.tags.name) ? el.tags.name : (isTrafficLight ? 'Radar Semáforo' : (isAvgSpeed ? 'Radar de Tramo SCT' : 'Radar Fijo SCT/OSM'))
    });
  });

  const deduplicated = [];
  combined.forEach(item => {
    const exists = deduplicated.some(existing => calcDistance(item.lat, item.lon, existing.lat, existing.lon) < 35);
    if (!exists) deduplicated.push(item);
  });

  activePois = deduplicated;
  if (systemRunning) {
    document.getElementById('statusText').innerText = 'Protección Activa (2º Plano)';
    checkProximityAlerts();
  }
  updateCounterUI();
}

async function fetchHelicopters() {
  if (!systemRunning) return;
  try {
    const url = `https://api.airplanes.live/v2/point/${userLat.toFixed(4)}/${userLon.toFixed(4)}/25`;
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    const detected = [];

    if (data && data.ac) {
      data.ac.forEach(ac => {
        if (!ac.lat || !ac.lon) return;
        const altMeters = (ac.alt_baro || 0) * 0.3048;
        const speedKmh = (ac.gs || 0) * 1.852;
        const callsign = (ac.flight || '').toUpperCase().trim();
        const type = (ac.t || '').toUpperCase().trim();

        const isHeliModel = ['AS55', 'EC35', 'H135', 'EC45', 'B06', 'R44', 'A109'].includes(type);
        const isPoliceCall = callsign.includes('DGT') || callsign.includes('MOSSOS') || callsign.includes('TRANSIT') || callsign.includes('POL');
        const isSurveillanceFlight = (altMeters > 110 && altMeters < 920 && speedKmh > 35 && speedKmh < 215);

        if (isHeliModel || isPoliceCall || isSurveillanceFlight) {
          detected.push({
            id: 'heli-' + ac.hex,
            lat: ac.lat, lon: ac.lon,
            alt: Math.round(altMeters), speed: Math.round(speedKmh),
            callsign: callsign || type || 'Vuelo Bajo'
          });
        }
      });
    }
    activeHelis = detected;
    updateCounterUI();
  } catch (e) {}
}

function checkProximityAlerts() {
  if (!systemRunning) return;
  const firstWarnDist = currentSpeed > 70 ? 800 : 480;
  const secondWarnDist = currentSpeed > 70 ? 280 : 170;

  let closestAheadRadar = null;
  let minAheadDist = 99999;

  activePois.forEach(poi => {
    const d = calcDistance(userLat, userLon, poi.lat, poi.lon);
    const prevD = prevDistanceMap.get(poi.id) || d;
    prevDistanceMap.set(poi.id, d);

    let isAhead = true;
    if (userHeading !== null && currentSpeed > 15 && d > 70) {
      const bearingToPoi = calcBearing(userLat, userLon, poi.lat, poi.lon);
      const angleDiff = Math.abs(((bearingToPoi - userHeading + 540) % 360) - 180);
      isAhead = angleDiff <= 75;
    }
    const isMovingAway = (d > prevD + 4) && d < 160;

    if (isAhead && !isMovingAway && d < minAheadDist) {
      minAheadDist = d;
      closestAheadRadar = poi;
    }
  });

  let closestHeli = null;
  let minHeliDist = 99999;
  activeHelis.forEach(h => {
    const d = calcDistance(userLat, userLon, h.lat, h.lon);
    if (d < minHeliDist) { minHeliDist = d; closestHeli = h; }
  });

  const ring = document.getElementById('ledRing');
  const badge = document.getElementById('limitBadge');

  if (closestAheadRadar && minAheadDist <= firstWarnDist) {
    const distRounded = Math.max(10, Math.round(minAheadDist / 10) * 10);
    const isOverspeed = closestAheadRadar.vmax > 0 && currentSpeed > (closestAheadRadar.vmax + 2);

    ring.className = (closestAheadRadar.type === 'MÓVIL') ? 
      (isOverspeed ? 'led-ring flash-red' : 'led-ring flash-blue') : 
      (isOverspeed ? 'led-ring flash-red' : 'led-ring flash-orange');

    document.getElementById('alertTitle').innerText = `⚠️ ${closestAheadRadar.type} A ${distRounded}m`;
    document.getElementById('alertSub').innerText = closestAheadRadar.name;

    if (closestAheadRadar.vmax > 0) {
      badge.style.display = 'flex';
      badge.innerText = closestAheadRadar.vmax;
    } else {
      badge.style.display = 'none';
    }

    const currentStage = alertedStage.get(closestAheadRadar.id) || 0;
    const limitText = closestAheadRadar.vmax > 0 ? `, límite ${closestAheadRadar.vmax}` : '';

    if (currentStage === 0) {
      alertedStage.set(closestAheadRadar.id, 1);
      speakAlert(`Atención, radar ${closestAheadRadar.type.toLowerCase()} a ${distRounded} metros${limitText}`, isOverspeed ? 'OVERSPEED' : 'RADAR', `⚠️ Radar ${closestAheadRadar.type} a ${distRounded}m`);
    } else if (currentStage === 1 && minAheadDist <= secondWarnDist) {
      alertedStage.set(closestAheadRadar.id, 2);
      if (isOverspeed) {
        speakAlert(`Frena, límite ${closestAheadRadar.vmax}`, 'OVERSPEED', `🚨 ¡Frena! Límite ${closestAheadRadar.vmax}`);
      } else {
        playOoonoBeep('RADAR');
      }
    }
    return;
  }

  if (closestHeli && minHeliDist <= 4500) {
    const kmDist = (minHeliDist / 1000).toFixed(1);
    ring.className = 'led-ring flash-purple';
    badge.style.display = 'none';
    document.getElementById('alertTitle').innerText = `🚁 HELICÓPTERO A ${kmDist} KM`;
    document.getElementById('alertSub').innerText = `Alt: ${closestHeli.alt}m | Vel: ${closestHeli.speed} km/h`;

    if (!alertedStage.has(closestHeli.id)) {
      alertedStage.set(closestHeli.id, 1);
      speakAlert(`Alerta aérea. Helicóptero a ${kmDist} kilómetros.`, 'HELI', `🚁 Helicóptero a ${kmDist} km`);
    }
    return;
  }

  ring.className = 'led-ring';
  badge.style.display = 'none';
  if (closestAheadRadar && minAheadDist < 15000) {
    document.getElementById('alertTitle').innerText = 'Ruta Vigilada';
    document.getElementById('alertSub').innerText = `Próximo: ${(minAheadDist / 1000).toFixed(1)} km (${closestAheadRadar.name})`;
  } else {
    document.getElementById('alertTitle').innerText = 'Ruta Protegida';
    document.getElementById('alertSub').innerText = `${activePois.length} radares activos en tu zona`;
  }
}

function reportIncident(type, label) {
  if (!systemRunning) startSystem();
  const newPoi = {
    id: 'usr-' + Date.now(),
    lat: userLat, lon: userLon,
    vmax: currentSpeed > 20 ? Math.round(currentSpeed / 10) * 10 : 80,
    type: type, name: `${label} (Reportado)`, ts: Date.now()
  };
  customReports.push(newPoi);
  localStorage.setItem('ooono_custom_reports', JSON.stringify(customReports));
  activePois.push(newPoi);
  updateCounterUI();
  speakAlert(`${label} guardado.`, type === 'HELI' ? 'HELI' : 'RADAR', `📍 ${label} Registrado`);
}

function testIntercomAudio() {
  if (!systemRunning) startSystem();
  const ring = document.getElementById('ledRing');
  ring.className = 'led-ring flash-red';
  document.getElementById('limitBadge').style.display = 'flex';
  document.getElementById('limitBadge').innerText = '80';
  speakAlert('Prueba de intercomunicador. Radar móvil a 300 metros, límite 80.', 'RADAR', '🔊 Prueba de Casco');
  setTimeout(() => { ring.className = 'led-ring'; }, 4000);
}

let pocketMode = false;
function togglePocketMode() {
  pocketMode = !pocketMode;
  document.body.style.opacity = pocketMode ? '0.08' : '1';
  speakAlert(pocketMode ? 'Modo bolsillo activado' : 'Pantalla normal', 'RADAR', pocketMode ? '🌑 Modo Bolsillo' : '☀️ Pantalla Activa');
}

function updateCounterUI() {
  document.getElementById('dbCounter').innerText = `📍 ${activePois.length} | 🚁 ${activeHelis.length}`;
}

function calcDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function calcBearing(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

window.addEventListener('load', () => {
  activePois = [...CATALUNYA_STATIC_RADARS];
  updateCounterUI();
  fetchLiveRadars(userLat, userLon);
  if (window.location.search.includes('auto=1')) {
    setTimeout(() => startSystem(), 700);
  }
});
